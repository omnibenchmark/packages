context:
  name: r-scshc
  version: "0.1.0"
  # GitHub-only package (not on CRAN/Bioconductor). Pinned to a commit; the
  # archive of a commit sha is content-stable, unlike branch tarballs.
  git_rev: 2671f6ee5a55572ddd7216de822044f9497d6161

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/igrabski/sc-SHC/archive/${{ git_rev }}.tar.gz
  sha256: e8395eb83138942fc6fdf032798a0d053490692c9b5c3f639aca3a172473bdd9

build:
  number: 0
  skip:
    - win
  script:
    - R CMD INSTALL --build .

requirements:
  host:
    - r-base >=3.5.0
    - r-mass
    - r-matrix
    - r-dendextend
    - r-matrixstats
    - r-rspectra
    - r-sfsmisc
    - r-fastcluster
    - r-data.tree
    - bioconductor-scry
    - bioconductor-biocneighbors
  run:
    - r-base >=3.5.0
    - r-mass
    - r-matrix
    - r-dendextend
    - r-matrixstats
    - r-rspectra
    - r-sfsmisc
    - r-fastcluster
    - r-data.tree
    - bioconductor-scry
    - bioconductor-biocneighbors

tests:
  - script:
    - Rscript -e "library('scSHC')"
  - script:
    - Rscript -e "library('scSHC'); packageVersion('scSHC')"

about:
  homepage: https://github.com/igrabski/sc-SHC
  summary: Significance Analysis for Clustering Single-Cell RNA-seq Data
  description: |
    A model-based hypothesis testing approach for evaluating single-cell
    RNA-sequencing (scRNA-seq) clusters. Implemented as (1) a stand-alone
    clustering pipeline with built-in hypothesis testing to produce clusters
    corresponding to distinct cell populations and (2) a post-hoc method that
    evaluates the statistical significance of any provided set of clusters.
  license: Artistic-2.0
  repository: https://github.com/igrabski/sc-SHC
