context:
  name: scgbm
  version: "1.2.0"
  git_rev: 50f500445112900c4ed03c12bdeb2e6a3df6ae8b
package:
  name: r-${{ name }}
  version: ${{ version }}
source:
  url: https://github.com/phillipnicol/scGBM/archive/${{ git_rev }}.tar.gz
  sha256: c19b8a0602991974ac6f83daf17da58b3b44ec73d37e6774237c26cf1b1c302a
build:
  number: 0
  noarch: generic
  script:
    - rm -f .Rprofile # delete to avoid renv build
    - R CMD INSTALL --build .
requirements:
  host:
    - r-base 4.5.*
    - r-ggforce
    - r-ggplot2
    - r-irlba
    - r-pheatmap
    - r-rstiefel 1.0.1 *_1
  run:
    - r-base
    - r-ggforce
    - r-ggplot2
    - r-irlba
    - r-pheatmap
    - r-rstiefel 1.0.1 *_1
tests:
  - script:
      - R -e "library('scGBM'); print(getNamespaceExports('scGBM'))"
about:
  homepage: https://github.com/phillipnicol/scGBM
  summary: Dimensionality reduction for single-cell RNA-seq using generalized bilinear models
  description: |
    scGBM performs model-based dimensionality reduction for single-cell RNA-seq
    by fitting a Poisson generalized bilinear model (GBM) to the count matrix.
    It provides a fast projection-based fit (gbm.sc), standard errors for the
    low-dimensional embedding (get.se), a cluster cohesion index for assessing
    cluster stability (CCI), and plotting helpers (plot_gbm).
  license: GPL-2.0-or-later
  repository: https://github.com/phillipnicol/scGBM