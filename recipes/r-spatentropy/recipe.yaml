context:
  build_number: '0'

package:
  name: r-spatentropy
  version: 2.2.4

source:
- url:
  - https://cran.r-project.org/src/contrib/SpatEntropy_2.2-4.tar.gz
  - https://cran.r-project.org/src/contrib/Archive/SpatEntropy_2.2-4.tar.gz
  sha256: 70552cbc71b370b42173f4ede95a990275c1fc4d95b610659c8c35beabf72c4f

build:
  number: ${{ build_number }}
  script:
    - if: win
      then: R CMD INSTALL --build . %R_ARGS%
      else: R CMD INSTALL --build . ${R_ARGS}
  noarch: generic

requirements:
  host:
    - r-base >=4.0.0
    - r-spatstat >=3.0-2
    - r-spatstat.geom
    - r-spatstat.random
  run:
    - r-base >=4.0.0
    - r-spatstat >=3.0-2
    - r-spatstat.geom
    - r-spatstat.random

tests:
- script:
  - Rscript -e 'library("SpatEntropy")'

about:
  summary: Spatial Entropy Measures
  description: |-
    The heterogeneity of spatial data presenting a finite
    number of categories can be measured via computation of spatial
    entropy. Functions are available for the computation of the
    main entropy and spatial entropy measures in the literature.
    They include the traditional version of Shannon's entropy
    (Shannon, 1948 <doi:10.1002/j.1538-7305.1948.tb01338.x>),
    Batty's spatial entropy (Batty, 1974
    <doi:10.1111/j.1538-4632.1974.tb01014.x>), O'Neill's entropy
    (O'Neill et al., 1998 <doi:10.1007/BF00162741>), Li and
    Reynolds' contagion index (Li and Reynolds, 1993
    <doi:10.1007/BF00125347>), Karlstrom and Ceccato's entropy
    (Karlstrom and Ceccato, 2002
    <https://urn.kb.se/resolve?urn=urn:nbn:se:kth:diva-61351>),
    Leibovici's entropy (Leibovici, 2009
    <doi:10.1007/978-3-642-03832-7_24>), Parresol and Edwards'
    entropy (Parresol and Edwards, 2014 <doi:10.3390/e16041842>)
    and Altieri's entropy (Altieri et al., 2018,
    <doi:10.1007/s10651-017-0383-1>). Full references for all
    measures can be found under the topic 'SpatEntropy'. The
    package is able to work with lattice and point data. The
    updated version works with the updated 'spatstat' package (>=
    3.0-2).
  license: GPL-3.0-only
  license_file:
  - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  repository: https://github.com/cran/SpatEntropy

